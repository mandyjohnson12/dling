name: Download External File
on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'The direct URL of the file to download'
        required: true
      file_name:
        description: 'What to name the file (including extension)'
        required: true

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the file back to the repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download File
        run: |
          curl -L "${{ github.event.inputs.file_url }}" -o "${{ github.event.inputs.file_name }}"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.file_name }}"
          git commit -m "Add downloaded file: ${{ github.event.inputs.file_name }}"
          git push
