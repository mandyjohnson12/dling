name: Auto-Download File
on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'The direct URL of the file to download'
        required: true

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Detect Filename
        run: |
          # Extract filename from URL
          URL="${{ github.event.inputs.file_url }}"
          FILENAME=$(basename "$URL")
          
          echo "Downloading $FILENAME..."
          curl -L "$URL" -o "$FILENAME"
          
          # Save filename for the next step
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.FINAL_FILENAME }}"
          git commit -m "Automated download of ${{ env.FINAL_FILENAME }}"
          git push
