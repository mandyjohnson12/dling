name: Auto-Download to Folder
on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'The direct URL of the file to download'
        required: true

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download to Downloads Folder
        run: |
          # Create the folder if it doesn't exist
          mkdir -p Downloads
          
          # Extract filename and set path
          URL="${{ github.event.inputs.file_url }}"
          FILENAME=$(basename "$URL")
          FILEPATH="Downloads/$FILENAME"
          
          echo "Downloading to $FILEPATH..."
          curl -L "$URL" -o "$FILEPATH"
          
          # Pass variables to next steps
          echo "FINAL_FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "FINAL_PATH=$FILEPATH" >> $GITHUB_ENV

      - name: Update README
        run: |
          if [ ! -f README.md ]; then
            echo "# Downloaded Files Archive" > README.md
            echo "Below is a list of files managed by this workflow:" >> README.md
            echo "" >> README.md
            echo "| File Name | Download Link |" >> README.md
            echo "| --- | --- |" >> README.md
          fi
          
          # Generate the link pointing to the Downloads folder
          # Note: We use the URL-encoded path for the link
          DOWNLOAD_LINK="https://github.com/${{ github.repository }}/raw/main/Downloads/${{ env.FINAL_FILENAME }}"
          
          echo "| ${{ env.FINAL_FILENAME }} | [Download]($DOWNLOAD_LINK) |" >> README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the specific file and README
          git add "${{ env.FINAL_PATH }}" README.md
          git commit -m "Added ${{ env.FINAL_FILENAME }} to Downloads"
          git push
