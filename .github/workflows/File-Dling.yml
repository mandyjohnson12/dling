name: Multi-Download to Folder
on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: 'Paste direct URLs (one per line)'
        required: true
        type: string

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Files and Update README
        run: |
          mkdir -p Downloads
          
          # Initialize README if it doesn't exist
          if [ ! -f README.md ]; then
            echo "# Downloaded Files Archive" > README.md
            echo "Below is a list of files managed by this workflow:" >> README.md
            echo "" >> README.md
            echo "| File Name | Download Link |" >> README.md
            echo "| --- | --- |" >> README.md
          fi

          # Read the multi-line input
          echo "${{ github.event.inputs.file_urls }}" > urls.txt

          while IFS= read -r URL || [ -n "$URL" ]; do
            # Skip empty lines
            [ -z "$URL" ] && continue
            
            # Clean the URL (remove carriage returns from Windows copy-paste)
            CLEAN_URL=$(echo "$URL" | tr -d '\r')
            FILENAME=$(basename "$CLEAN_URL")
            FILEPATH="Downloads/$FILENAME"
            
            echo "Downloading $FILENAME..."
            curl -L "$CLEAN_URL" -o "$FILEPATH"
            
            # Add to README table
            DOWNLOAD_LINK="https://github.com/${{ github.repository }}/raw/main/Downloads/$FILENAME"
            echo "| $FILENAME | [Download]($DOWNLOAD_LINK) |" >> README.md
            
          done < urls.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Downloads/ README.md
          git commit -m "Batch download of multiple files" || echo "No changes to commit"
          git push
