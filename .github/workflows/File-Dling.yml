name: Space-Separated Multi-Download
on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: 'Paste URLs separated by SPACES'
        required: true
        type: string

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Files and Update README
        run: |
          mkdir -p Downloads
          
          # Initialize README if it doesn't exist
          if [ ! -f README.md ]; then
            echo "# Downloaded Files Archive" > README.md
            echo "Below is a list of files managed by this workflow:" >> README.md
            echo "" >> README.md
            echo "| File Name | Download Link |" >> README.md
            echo "| --- | --- |" >> README.md
          fi

          # Loop through the input, splitting by spaces
          for URL in ${{ github.event.inputs.file_urls }}; do
            
            # Extract filename from URL
            FILENAME=$(basename "$URL")
            FILEPATH="Downloads/$FILENAME"
            
            echo "Processing $FILENAME..."
            
            # Download the file
            curl -L "$URL" -o "$FILEPATH"
            
            # Add to README table
            DOWNLOAD_LINK="https://github.com/${{ github.repository }}/raw/main/Downloads/$FILENAME"
            echo "| $FILENAME | [Download]($DOWNLOAD_LINK) |" >> README.md
            
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Downloads/ README.md
          git commit -m "Batch download via space-separated links" || echo "No changes to commit"
          git push
