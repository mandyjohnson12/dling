name: Conditional Split & Organize
on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: 'Paste URLs separated by SPACES'
        required: true
        type: string

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Downloads
        run: |
          mkdir -p Downloads
          
          # Initialize README if it doesn't exist
          if [ ! -f README.md ]; then
            echo "# Downloaded Files Archive" > README.md
            echo "| File Name | Status | Download Link |" >> README.md
            echo "| --- | --- | --- |" >> README.md
          fi

          # Loop through space-separated URLs
          for URL in ${{ github.event.inputs.file_urls }}; do
            FILENAME=$(basename "$URL")
            
            echo "Downloading $FILENAME..."
            curl -L "$URL" -o "$FILENAME"
            
            # Get file size in Megabytes
            FILE_SIZE=$(du -m "$FILENAME" | cut -f1)

            if [ "$FILE_SIZE" -gt 95 ]; then
              # LARGE FILE: Create timestamped folder and split
              TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
              TARGET_DIR="Downloads/$TIMESTAMP-$FILENAME"
              mkdir -p "$TARGET_DIR"
              
              echo "$FILENAME is $FILE_SIZE MB. Splitting into $TARGET_DIR..."
              7z a -v95m "$TARGET_DIR/${FILENAME}.7z" "$FILENAME"
              rm "$FILENAME"
              
              # Add folder link to README
              echo "| $FILENAME | Splitted (7z) | [View Folder](https://github.com/${{ github.repository }}/tree/main/$TARGET_DIR) |" >> README.md
            else
              # SMALL FILE: Move directly to Downloads
              echo "$FILENAME is $FILE_SIZE MB. Moving to Downloads root."
              mv "$FILENAME" "Downloads/"
              
              # Add direct link to README
              DOWNLOAD_LINK="https://github.com/${{ github.repository }}/raw/main/Downloads/$FILENAME"
              echo "| $FILENAME | Original | [Download]($DOWNLOAD_LINK) |" >> README.md
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Downloads/ README.md
          git commit -m "Organized download (Conditional Splitting)" || echo "No changes"
          git push
