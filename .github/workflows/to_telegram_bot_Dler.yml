name: File Downloader to Telegram (M-NRZ)
on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: 'Paste URLs (Separated by spaces OR newlines)'
        required: true
        type: string
      package_style:
        description: 'Packaging Style'
        required: true
        type: choice
        options:
          - 'Send each file separately'
          - 'Combine all into a single Zip file'
        default: 'Send each file separately'

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Process Downloads and Upload to Telegram
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "❌ Error: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing in GitHub Secrets."
            exit 1
          fi

          mkdir -p staging_area
          FILE_CLOCK=$(date +'%Y-%m-%d_%H-%M-%S')
          PKG_STYLE="${{ github.event.inputs.package_style }}"

          echo "$RAW_URLS" | tr ' ' '\n' | tr -d '\r' | sed '/^[[:space:]]*$/d' > clean_urls.txt

          while IFS= read -r URL || [ -n "$URL" ]; do
            FILENAME=$(basename "$URL")
            echo "📥 Downloading $FILENAME..."
            curl -L "$URL" -o "staging_area/$FILENAME"
            
            if [ ! -f "staging_area/$FILENAME" ]; then
              echo "❌ Error: Failed to download $FILENAME"
            fi
          done < clean_urls.txt

          send_to_telegram() {
            local filepath="$1"
            local caption="$2"
            echo "📤 Uploading $(basename "$filepath") to Telegram..."
            
            RESPONSE=$(curl -s -F "chat_id=$TG_CHAT" \
              -F "document=@$filepath" \
              -F "caption=$caption" \
              "https://api.telegram.org/bot$TG_TOKEN/sendDocument")
              
            if echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "✅ Successfully sent $(basename "$filepath")"
            else
              echo "❌ Telegram Upload Failed for $(basename "$filepath")"
              echo "Response: $RESPONSE"
            fi
          }

          if [ "$PKG_STYLE" = "Combine all into a single Zip file" ]; then
            MASTER_NAME="Batch_Package_${FILE_CLOCK}.zip"
            echo "📦 Combining files into $MASTER_NAME..."
            
            cd staging_area
            7z a "../$MASTER_NAME" *
            cd ..
            
            TOTAL_SIZE=$(du -m "$MASTER_NAME" | cut -f1)
            if [ "$TOTAL_SIZE" -gt 2000 ]; then
              echo "❌ Error: Total Zip size ($TOTAL_SIZE MB) exceeds Telegram 2GB limit."
              exit 1
            fi
            
            send_to_telegram "$MASTER_NAME" "📦 Combined Master Zip ($TOTAL_SIZE MB) | Generated on $FILE_CLOCK"
            rm -f "$MASTER_NAME"

          else
            echo "📄 Processing files individually..."
            cd staging_area
            for FILENAME in *; do
              [ -e "$FILENAME" ] || continue
              
              FILE_SIZE=$(du -m "$FILENAME" | cut -f1)
              if [ "$FILE_SIZE" -gt 2000 ]; then
                echo "❌ Skipped $FILENAME ($FILE_SIZE MB) - Exceeds Telegram 2GB limit."
                continue
              fi
              
              send_to_telegram "$FILENAME" "📄 File: $FILENAME ($FILE_SIZE MB)"
            done
            cd ..
          fi

          rm -rf staging_area clean_urls.txt
