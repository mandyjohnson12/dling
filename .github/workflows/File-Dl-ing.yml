name: Conditional Split & Compress
on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: 'Paste URLs separated by SPACES'
        required: true
        type: string
      compression_choice:
        description: 'Format for small files (< 95MB)'
        required: true
        type: choice
        options:
          - 'Keep Original Format'
          - 'Zip the file'
        default: 'Keep Original Format'

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Process Downloads
        run: |
          mkdir -p Downloads
          
          # Initialize README if it doesn't exist
          if [ ! -f README.md ]; then
            echo "# Downloaded Files Archive" > README.md
            echo "| File Name | Status | Download Link |" >> README.md
            echo "| --- | --- | --- |" >> README.md
          fi

          CHOICE="${{ github.event.inputs.compression_choice }}"

          # Loop through space-separated URLs
          for URL in ${{ github.event.inputs.file_urls }}; do
            # Extract filename from URL and handle special characters
            RAW_FILENAME=$(basename "$URL")
            # Use printf to properly handle special characters
            FILENAME=$(printf "%s" "$RAW_FILENAME")
            
            echo "Downloading $FILENAME..."
            
            # Download with proper quoting
            curl -L -o "$FILENAME" "$URL"
            
            # Check if download was successful
            if [ ! -f "$FILENAME" ]; then
              echo "Failed to download $FILENAME"
              echo "| $FILENAME | Download Failed | - |" >> README.md
              continue
            fi
            
            # Get file size in Megabytes
            FILE_SIZE=$(du -m "$FILENAME" | cut -f1)
            
            # If file size is 0 or negative, treat as 1MB
            if [ -z "$FILE_SIZE" ] || [ "$FILE_SIZE" -eq 0 ]; then
              FILE_SIZE=1
            fi

            if [ "$FILE_SIZE" -gt 95 ]; then
              # FORCE SPLIT FOR LARGE FILES
              TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
              SAFE_FILENAME=$(echo "$FILENAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
              TARGET_DIR="Downloads/$TIMESTAMP-$SAFE_FILENAME"
              mkdir -p "$TARGET_DIR"
              
              echo "$FILENAME is $FILE_SIZE MB. Automatically splitting into $TARGET_DIR..."
              7z a -v95m "$TARGET_DIR/${SAFE_FILENAME}.7z" "$FILENAME"
              rm "$FILENAME"
              
              echo "| $FILENAME | Forced Split (>95MB) | [View Folder](${{ github.server_url }}/${{ github.repository }}/tree/main/$TARGET_DIR) |" >> README.md
            
            else
              # HANDLES SMALL FILES BASED ON USER CHOICE
              if [ "$CHOICE" = "Zip the file" ]; then
                SAFE_ZIP_NAME=$(echo "${FILENAME%.*}.zip" | sed 's/[^a-zA-Z0-9._-]/_/g')
                echo "Zipping $FILENAME into $SAFE_ZIP_NAME..."
                
                # Zip the file using 7z
                7z a "Downloads/$SAFE_ZIP_NAME" "$FILENAME"
                rm "$FILENAME"
                
                DOWNLOAD_LINK="${{ github.server_url }}/${{ github.repository }}/raw/main/Downloads/$SAFE_ZIP_NAME"
                echo "| $FILENAME | Compressed (Zip) | [Download]($DOWNLOAD_LINK) |" >> README.md
              else
                echo "Keeping original format for $FILENAME."
                SAFE_FILENAME=$(echo "$FILENAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
                mv "$FILENAME" "Downloads/$SAFE_FILENAME"
                
                DOWNLOAD_LINK="${{ github.server_url }}/${{ github.repository }}/raw/main/Downloads/$SAFE_FILENAME"
                echo "| $FILENAME | Original | [Download]($DOWNLOAD_LINK) |" >> README.md
              fi
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Downloads/ README.md
          git commit -m "Downloads processed with user formatting preference" || echo "No changes to commit"
          git push
