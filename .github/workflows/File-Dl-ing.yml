name: Conditional Split & Compress
on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: 'Paste URLs separated by SPACES'
        required: true
        type: string
      compression_choice:
        description: 'Format for small files (< 95MB)'
        required: true
        type: choice
        options:
          - 'Keep Original Format'
          - 'Zip the file'
        default: 'Keep Original Format'

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Process Downloads
        env:
          URLS: ${{ github.event.inputs.file_urls }}
          CHOICE: ${{ github.event.inputs.compression_choice }}
        run: |
          mkdir -p Downloads
          
          if [ ! -f README.md ]; then
            echo "# Downloaded Files Archive" > README.md
            echo "" >> README.md
            echo "| File Name | Status | Download Link |" >> README.md
            echo "| --- | --- | --- |" >> README.md
          fi
          
          read -ra URL_ARRAY <<< "$URLS"
          
          for URL in "${URL_ARRAY[@]}"; do
            FILENAME=$(basename "$URL")
            echo "Downloading: $FILENAME"
            curl -L -o "$FILENAME" "$URL"
            
            if [ ! -f "$FILENAME" ]; then
              echo "| $FILENAME | Failed | Download Error |" >> README.md
              continue
            fi
            
            FILE_SIZE=$(du -m "$FILENAME" | cut -f1)
            if [ -z "$FILE_SIZE" ] || [ "$FILE_SIZE" -eq 0 ]; then
              FILE_SIZE=1
            fi
            
            if [ "$FILE_SIZE" -gt 95 ]; then
              TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
              SAFE_FILENAME=$(echo "$FILENAME" | sed 's/[()]//g' | sed 's/[^a-zA-Z0-9._-]/_/g')
              TARGET_DIR="Downloads/$TIMESTAMP-$SAFE_FILENAME"
              mkdir -p "$TARGET_DIR"
              7z a -v95m "$TARGET_DIR/${SAFE_FILENAME}.7z" "$FILENAME"
              rm "$FILENAME"
              FOLDER_LINK="${{ github.server_url }}/${{ github.repository }}/tree/main/$TARGET_DIR"
              echo "| $FILENAME | Split (>95MB) | [View Folder]($FOLDER_LINK) |" >> README.md
            else
              if [ "$CHOICE" = "Zip the file" ]; then
                SAFE_ZIP_NAME=$(echo "$FILENAME" | sed 's/[()]//g' | sed 's/[^a-zA-Z0-9._-]/_/g' | sed 's/\.[^.]*$/.zip/')
                7z a "Downloads/$SAFE_ZIP_NAME" "$FILENAME"
                rm "$FILENAME"
                DOWNLOAD_LINK="${{ github.server_url }}/${{ github.repository }}/raw/main/Downloads/$SAFE_ZIP_NAME"
                echo "| $FILENAME | Compressed | [Download]($DOWNLOAD_LINK) |" >> README.md
              else
                SAFE_FILENAME=$(echo "$FILENAME" | sed 's/[()]//g' | sed 's/[^a-zA-Z0-9._-]/_/g')
                mv "$FILENAME" "Downloads/$SAFE_FILENAME"
                DOWNLOAD_LINK="${{ github.server_url }}/${{ github.repository }}/raw/main/Downloads/$SAFE_FILENAME"
                echo "| $FILENAME | Original | [Download]($DOWNLOAD_LINK) |" >> README.md
              fi
            fi
          done
          
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Updated: $(date '+%Y-%m-%d %H:%M:%S UTC')*" >> README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Downloads/ README.md
          git commit -m "Downloads processed" || echo "No changes"
          git push
