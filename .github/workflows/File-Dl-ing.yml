name: Conditional Split, Compress & Package
on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: 'Paste URLs (Separated by spaces OR newlines)'
        required: true
        type: string
      compression_choice:
        description: 'Format for individual files (< 95MB)'
        required: true
        type: choice
        options:
          - 'Keep Original Format'
          - 'Zip the file'
        default: 'Keep Original Format'
      package_style:
        description: 'Packaging Style'
        required: true
        type: choice
        options:
          - 'Download each file separately'
          - 'Combine all into a single Zip file'
        default: 'Download each file separately'

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Downloads
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
        run: |
          mkdir -p Downloads
          mkdir -p staging_area
          
          # Initialize README with a title if it doesn't exist
          if [ ! -f README.md ]; then
            echo "# Downloaded Files Archive" > README.md
            echo "Below is a history of files managed by this workflow:" >> README.md
            echo "" >> README.md
          fi

          # Set up clean batch timestamps
          BATCH_TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
          FOLDER_TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          FILE_CLOCK=$(date +'%Y-%m-%d_%H-%M-%S')
          
          TEMP_README="temp_batch.md"
          echo "### 📥 Download Batch: $BATCH_TIMESTAMP" > "$TEMP_README"
          echo "| File Name / Part | Status | Direct Download Link |" >> "$TEMP_README"
          echo "| --- | --- | --- |" >> "$TEMP_README"

          COMP_CHOICE="${{ github.event.inputs.compression_choice }}"
          PKG_STYLE="${{ github.event.inputs.package_style }}"

          # SANITIZATION ENGINE: Convert spaces to newlines, strip Windows returns, and clean whitespace
          echo "$RAW_URLS" | tr ' ' '\n' | tr -d '\r' | sed '/^[[:space:]]*$/d' > clean_urls.txt

          # Step 1: Download all files into a temporary staging workspace
          while IFS= read -r URL || [ -n "$URL" ]; do
            FILENAME=$(basename "$URL")
            echo "Downloading $FILENAME..."
            curl -L "$URL" -o "staging_area/$FILENAME"
            
            if [ ! -f "staging_area/$FILENAME" ]; then
              echo "❌ Error: Failed to download $FILENAME"
              echo "| $FILENAME | ❌ Download Failed | Link Broken / Timeout |" >> "$TEMP_README"
            fi
          done < clean_urls.txt

          # Step 2: Process files depending on user choice
          if [ "$PKG_STYLE" = "Combine all into a single Zip file" ]; then
            echo "📦 Option selected: Combining all files into a single master archive."
            
            MASTER_NAME="Batch_Package_${FILE_CLOCK}.zip"
            
            # Zip everything in the staging area into a single archive file
            cd staging_area
            7z a "../$MASTER_NAME" *
            cd ..
            
            # Check size of the final combined bundle
            TOTAL_SIZE=$(du -m "$MASTER_NAME" | cut -f1)
            
            if [ "$TOTAL_SIZE" -gt 95 ]; then
              TARGET_DIR="Downloads/${FOLDER_TIMESTAMP}-${MASTER_NAME%.*}"
              mkdir -p "$TARGET_DIR"
              
              echo "⚠️ Master bundle is large ($TOTAL_SIZE MB). Splitting bundle into parts..."
              7z a -v95m "$TARGET_DIR/${MASTER_NAME}.7z" "$MASTER_NAME"
              rm "$MASTER_NAME"
              
              for PART_PATH in "$TARGET_DIR"/*; do
                PART_NAME=$(basename "$PART_PATH")
                # CHANGED: Using raw.githubusercontent.com for split parts inside packages
                DOWNLOAD_LINK="https://raw.githubusercontent.com/${{ github.repository }}/main/$TARGET_DIR/$PART_NAME"
                echo "| ↳ $PART_NAME | Split Master Bundle Part | [Download]($DOWNLOAD_LINK) |" >> "$TEMP_README"
              done
            else
              echo "✅ Master bundle is within size limits ($TOTAL_SIZE MB)."
              mv "$MASTER_NAME" "Downloads/"
              # CHANGED: Using raw.githubusercontent.com for combined small packages
              DOWNLOAD_LINK="https://raw.githubusercontent.com/${{ github.repository }}/main/Downloads/$MASTER_NAME"
              echo "| $MASTER_NAME | Combined Master Zip | [Download]($DOWNLOAD_LINK) |" >> "$TEMP_README"
            fi

          else
            echo "📄 Option selected: Downloading each file separately."
            
            cd staging_area
            for FILENAME in *; do
              # Guard against empty directories
              [ -e "$FILENAME" ] || continue
              
              FILE_SIZE=$(du -m "$FILENAME" | cut -f1)

              if [ "$FILE_SIZE" -gt 95 ]; then
                TARGET_DIR="../Downloads/${FOLDER_TIMESTAMP}-${FILENAME}"
                mkdir -p "$TARGET_DIR"
                
                echo "⚠️ File is large ($FILE_SIZE MB). Splitting into parts..."
                7z a -v95m "$TARGET_DIR/${FILENAME}.7z" "$FILENAME"
                
                for PART_PATH in "$TARGET_DIR"/*; do
                  PART_NAME=$(basename "$PART_PATH")
                  # CHANGED: Using raw.githubusercontent.com for standalone split parts
                  DOWNLOAD_LINK="https://raw.githubusercontent.com/${{ github.repository }}/main/${TARGET_DIR#../}/$PART_NAME"
                  echo "| ↳ $PART_NAME | Split Part | [Download]($DOWNLOAD_LINK) |" >> "../$TEMP_README"
                done
              
              else
                FILE_BASE="${FILENAME%.*}"
                FILE_EXT="${FILENAME##*.}"
                
                if [ "$COMP_CHOICE" = "Zip the file" ]; then
                  ZIP_NAME="${FILE_BASE}_${FILE_CLOCK}.zip"
                  echo "⚡ Compressing individual file into $ZIP_NAME..."
                  7z a "../Downloads/$ZIP_NAME" "$FILENAME"
                  
                  # CHANGED: Using raw.githubusercontent.com for small zipped files
                  DOWNLOAD_LINK="https://raw.githubusercontent.com/${{ github.repository }}/main/Downloads/$ZIP_NAME"
                  echo "| $ZIP_NAME | Compressed (Zip) | [Download]($DOWNLOAD_LINK) |" >> "../$TEMP_README"
                else
                  NEW_NAME="${FILE_BASE}_${FILE_CLOCK}.${FILE_EXT}"
                  echo "✅ Keeping original file format: $NEW_NAME"
                  mv "$FILENAME" "../Downloads/$NEW_NAME"
                  
                  # CHANGED: Using raw.githubusercontent.com for small raw files
                  DOWNLOAD_LINK="https://raw.githubusercontent.com/${{ github.repository }}/main/Downloads/$NEW_NAME"
                  echo "| $NEW_NAME | Original | [Download]($DOWNLOAD_LINK) |" >> "../$TEMP_README"
                fi
              fi
            done
            cd ..
          fi

          # Clean up workspace
          rm -rf staging_area clean_urls.txt

          echo "" >> "$TEMP_README"
          echo "---" >> "$TEMP_README"
          echo "" >> "$TEMP_README"

          # Fix legacy headers if present
          if grep -q "Below is a list of files managed by this workflow:" README.md; then
             sed -i 's/Below is a list of files managed by this workflow:/Below is a history of files managed by this workflow:/g' README.md
          fi

          # Splice new table into README
          sed -n '1,2p' README.md > top.txt
          sed -n '3,$p' README.md > bottom.txt
          cat top.txt "$TEMP_README" bottom.txt > README.md
          rm top.txt bottom.txt "$TEMP_README"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Downloads/ README.md
          git commit -m "Batch execution complete: Links optimized with raw domain" || echo "No changes"
          git push
