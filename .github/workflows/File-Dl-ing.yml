name: Conditional Split & Organize
on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: 'Paste URLs separated by SPACES'
        required: true
        type: string

# Ensures only one download task runs at a time to minimize conflicts
concurrency:
  group: download-archive
  cancel-in-progress: false

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Process Downloads
        env:
          FILE_URLS: ${{ github.event.inputs.file_urls }}
        run: |
          mkdir -p Downloads
          
          # 1. Process New Downloads
          for URL in $FILE_URLS; do
            CLEAN_NAME=$(basename "$URL" | cut -d'?' -f1)
            echo "Downloading $CLEAN_NAME..."
            curl -L "$URL" -o "$CLEAN_NAME"
            
            if [ -f "$CLEAN_NAME" ]; then
              FILE_SIZE=$(du -m "$CLEAN_NAME" | cut -f1)

              if [ "$FILE_SIZE" -gt 95 ]; then
                TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
                TARGET_DIR="Downloads/$TIMESTAMP-$CLEAN_NAME"
                mkdir -p "$TARGET_DIR"
                7z a -v95m "$TARGET_DIR/${CLEAN_NAME}.7z" "$CLEAN_NAME"
                rm "$CLEAN_NAME"
              else
                mv "$CLEAN_NAME" "Downloads/"
              fi
            fi
          done

          # 2. Sync with remote before rebuilding README
          # This ensures we see files uploaded by other recent runs
          git pull origin main

          # 3. Rebuild README for the Main Page
          echo "# 📂 Global Download Archive" > README.md
          echo "Last updated: $(date)" >> README.md
          echo "" >> README.md
          
          echo "## 📄 Individual Files" >> README.md
          echo "| File Name | Download Link |" >> README.md
          echo "| --- | --- |" >> README.md
          
          find Downloads -maxdepth 1 -type f | while read file; do
            fname=$(basename "$file")
            raw_url="https://github.com/${{ github.repository }}/raw/main/Downloads/$fname"
            echo "| $fname | [Download]($raw_url) |" >> README.md
          done

          echo "" >> README.md
          echo "## 📁 Split Archives" >> README.md
          
          find Downloads -maxdepth 1 -type d ! -path "Downloads" | sort -r | while read dir; do
            dirname=$(basename "$dir")
            echo "### $dirname" >> README.md
            echo "| Part Name | Direct Link |" >> README.md
            echo "| --- | --- |" >> README.md
            
            find "$dir" -type f | sort | while read part; do
              pname=$(basename "$part")
              p_url="https://github.com/${{ github.repository }}/raw/main/Downloads/$dirname/$pname"
              echo "| $pname | [Download Part]($p_url) |" >> README.md
            done
            echo "" >> README.md
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Archive: $(date +'%Y-%m-%d %H:%M')"
            
            # The -X theirs flag forces Git to use our new README if a conflict occurs
            git pull --rebase -X theirs origin main
            
            git push origin main
          fi
