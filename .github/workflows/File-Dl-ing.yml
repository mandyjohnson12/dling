name: Conditional Split & Organize
on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: 'Paste URLs separated by SPACES'
        required: true
        type: string

concurrency:
  group: download-archive
  cancel-in-progress: false

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Process Downloads
        env:
          FILE_URLS: ${{ github.event.inputs.file_urls }}
        run: |
          mkdir -p Downloads
          
          # 1. Process New Downloads
          for URL in $FILE_URLS; do
            # Initial clean up of the name
            RAW_NAME=$(basename "$URL" | cut -d'?' -f1 | tr ' ' '_')
            
            # Generate the Timestamp
            TS=$(date +'%Y-%m-%d_%H-%M-%S')

            # Split extension and filename to insert timestamp
            if [[ "$RAW_NAME" == *.* ]]; then
                EXT="${RAW_NAME##*.}"
                BASE="${RAW_NAME%.*}"
                FINAL_NAME="${BASE}_${TS}.${EXT}"
            else
                FINAL_NAME="${RAW_NAME}_${TS}"
            fi
            
            echo "Downloading as $FINAL_NAME..."
            curl -L "$URL" -o "$FINAL_NAME"
            
            if [ -f "$FINAL_NAME" ]; then
              FILE_SIZE=$(du -m "$FINAL_NAME" | cut -f1)

              if [ "$FILE_SIZE" -gt 95 ]; then
                # LARGE FILE: Create folder named after the timestamped file
                TARGET_DIR="Downloads/$FINAL_NAME-Archive"
                mkdir -p "$TARGET_DIR"
                7z a -v95m "$TARGET_DIR/${FINAL_NAME}.7z" "$FINAL_NAME"
                rm "$FINAL_NAME"
              else
                # SMALL FILE: Move directly to Downloads
                mv "$FINAL_NAME" "Downloads/"
              fi
            fi
          done

          # 2. Sync with remote
          git pull origin main

          # 3. Rebuild README with Direct Links
          REPO_PATH="${{ github.repository }}"
          
          echo "# 📂 Global Download Archive" > README.md
          echo "Last updated: $(date)" >> README.md
          echo "" >> README.md
          
          echo "## 📄 Individual Files" >> README.md
          echo "| File Name | Direct Download Link |" >> README.md
          echo "| --- | --- |" >> README.md
          
          find Downloads -maxdepth 1 -type f | sort -r | while read file; do
            fname=$(basename "$file")
            direct_url="https://raw.githubusercontent.com/$REPO_PATH/main/Downloads/$fname"
            echo "| $fname | [Direct Download]($direct_url) |" >> README.md
          done

          echo "" >> README.md
          echo "## 📁 Split Archives" >> README.md
          
          find Downloads -maxdepth 1 -type d ! -path "Downloads" | sort -r | while read dir; do
            dirname=$(basename "$dir")
            echo "### $dirname" >> README.md
            echo "| Part Name | Direct Link |" >> README.md
            echo "| --- | --- |" >> README.md
            
            find "$dir" -type f | sort | while read part; do
              pname=$(basename "$part")
              p_url="https://raw.githubusercontent.com/$REPO_PATH/main/Downloads/$dirname/$pname"
              echo "| $pname | [Download Part]($p_url) |" >> README.md
            done
            echo "" >> README.md
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Archive: $(date +'%Y-%m-%d %H:%M')"
            # Handle potential conflicts by favoring our newly built README
            git pull --rebase -X theirs origin main
            git push origin main
          fi
